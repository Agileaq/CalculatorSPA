# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stamp commit SHA into cache + badge
        # Auto-update trigger (option B): inject the short commit SHA into sw.js
        # CACHE string and the version badges so every push makes sw.js byte-diff
        # (the SW update-detection trigger) WITHOUT requiring a manual version bump.
        # The human-readable version (v8, v9...) is still bumped manually for real
        # releases; the SHA is the per-commit cache key that prompts installed PWAs.
        run: |
          SHA="${GITHUB_SHA::7}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "short SHA=${SHA}"
          perl -i -pe "s/const CACHE = \"calc-([a-z0-9]+)\";/const CACHE = \"calc-\$1-${SHA}\";/" sw.js
          perl -i -pe "s|(<div id=\"version\">v[0-9a-z]+)(</div>)|\$1 · ${SHA}\$2|" index.html
          perl -i -pe "s|(<div id=\"version\">v[0-9a-z]+) · dev(</div>)|\$1 · ${SHA} · dev\$2|" dev.html
          echo "Stamped commit ${SHA}:"
          echo "--- sw.js ---"; grep '^const CACHE' sw.js
          echo "--- index.html ---"; grep 'id="version"' index.html
          echo "--- dev.html ---"; grep 'id="version"' dev.html
          # Fail-fast: prove the stamp actually took. If sw.js does NOT contain the
          # SHA suffix, the stamp silently failed and the deployed artifact would
          # carry the un-stamped CACHE (so installed PWAs never see a byte-diff and
          # never prompt). Exit non-zero so the run goes red and the root cause is
          # visible in the step log instead of a misleading green check.
          grep -q "^const CACHE = \"calc-[a-z0-9]*-${SHA}\";$" sw.js || { echo "STAMP FAILED: sw.js missing -${SHA}"; exit 1; }
          grep -q "v[a-z0-9]* · ${SHA}" index.html || { echo "STAMP FAILED: index.html missing · ${SHA}"; exit 1; }
          echo "STAMP OK"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Verify workspace sw.js right before upload (diag)
        run: |
          echo "pwd=$(pwd)"
          echo "--- workspace sw.js (what stamp left) ---"
          grep '^const CACHE' sw.js
          echo "--- find all sw.js under workspace ---"
          find . -name sw.js -not -path './.git/*' -exec grep -H '^const CACHE' {} \;
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Inspect uploaded artifact (diag)
        run: |
          echo "--- artifact.tar sw.js entry ---"
          tar -xzf "$RUNNER_TEMP/artifact.tar" -O ./sw.js 2>/dev/null | grep '^const CACHE' || echo "sw.js not in artifact at ./sw.js"
          echo "--- artifact tar listing (sw.js / index.html) ---"
          tar -tzf "$RUNNER_TEMP/artifact.tar" 2>/dev/null | grep -E '(^|/)(sw\.js|index\.html)$' | head
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
