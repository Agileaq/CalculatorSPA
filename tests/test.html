<!doctype html>
<html><head><meta charset="utf-8"><title>Calculator Tests</title></head>
<body>
<script type="module">
  // 后续 Task 会在此逐个 import '../js/*.test.js'（若拆分）或直接内联用例。
  // 本计划将各引擎单测直接写入本文件的 module script 中。
  import { test, assertEqual, assertClose, assertThrows, runAll } from './assert.js';
  import { formatNumber } from '../js/formatter.js';
  import { lex, TOKEN_TYPES as T } from '../js/lexer.js';
  import { parse } from '../js/parser.js';
  import { evaluate, CalcError } from '../js/evaluator.js';
  import { evaluate as engineEval } from '../js/engine.js';
  import { Editor } from '../js/tokens.js';
  import { Store } from '../js/history.js';
  import { AppState } from '../js/state.js';
  import { ACTIONS, SHIFT_ACTIONS, KEYBOARD } from '../js/keymap.js';
  import { MATH_CATALOG } from '../js/mathmenu.js';
  import { buildTape } from '../js/tape.js';
  import { LOCALES, getLocale, setLocale, cycleLocale, getLocaleMeta, t } from '../js/i18n.js';
  import { shouldShowBanner, shouldReloadOnControllerChange } from '../js/update.js';

  function memStorage() {
    const m = {};
    return {
      getItem: (k) => (k in m ? m[k] : null),
      setItem: (k, v) => { m[k] = String(v); },
      removeItem: (k) => { delete m[k]; },
    };
  }

  test('formatNumber 清理浮点毛刺', () => assertEqual(formatNumber(0.1 + 0.2), '0.3'));
  test('formatNumber 整数', () => assertEqual(formatNumber(1024), '1024'));
  test('formatNumber 去末尾零', () => assertEqual(formatNumber(1.5000000000), '1.5'));
  test('formatNumber -0 归零', () => assertEqual(formatNumber(-0), '0'));
  test('formatNumber 大数科学计数', () => assertEqual(formatNumber(1e15), '1e+15'));
  test('formatNumber 小数科学计数', () => assertEqual(formatNumber(0.0000000001), '1e-10'));
  test('formatNumber 12位有效数字', () => assertEqual(formatNumber(1/3), '0.333333333333'));

  const types = (atoms) => lex(atoms).map(t => t.type);

  test('lex 基本数字与运算', () => {
    const t = lex(['2', '+', '3']);
    assertEqual(t.length, 3);
    assertEqual(t[0].type, T.NUM); assertEqual(t[0].value, 2);
    assertEqual(t[1].type, T.OP);  assertEqual(t[1].value, '+');
  });
  test('lex 函数展开为 FUNC+LPAREN', () => {
    const t = lex(['sin(', '30', ')']);
    assertEqual(t[0].type, T.FUNC); assertEqual(t[0].value, 'sin');
    assertEqual(t[1].type, T.LPAREN);
    assertEqual(t[2].type, T.NUM);
    assertEqual(t[3].type, T.RPAREN);
  });
  test('lex 隐式乘法 数字接常量', () => {
    assertEqual(types(['2', 'pi']).join(','), [T.NUM, T.OP, T.CONST].join(','));
  });
  test('lex 隐式乘法 括号接括号', () => {
    assertEqual(types([')', '(']).join(','), [T.RPAREN, T.OP, T.LPAREN].join(','));
  });
  test('lex 隐式乘法 数字接函数', () => {
    assertEqual(types(['2', 'sin(']).join(','), [T.NUM, T.OP, T.FUNC, T.LPAREN].join(','));
  });
  test('lex 未知原子报错', () => assertThrows(() => lex(['@']), 'Syntax Error'));
  test('lex 新函数 log 展开', () => {
    const t = lex(['log(', '100', ')']);
    assertEqual(t[0].type, T.FUNC); assertEqual(t[0].value, 'log');
    assertEqual(t[1].type, T.LPAREN);
  });
  test('lex 新函数 asin/cbrt/abs', () => {
    assertEqual(lex(['asin('])[0].value, 'asin');
    assertEqual(lex(['cbrt('])[0].value, 'cbrt');
    assertEqual(lex(['abs('])[0].value, 'abs');
  });
  test('lex nCr/nPr 为 OP', () => {
    const t = lex(['5', 'nCr', '2']);
    assertEqual(t[1].type, T.OP); assertEqual(t[1].value, 'nCr');
    assertEqual(t.length, 3); // 无隐式乘法插入
  });

  const ast = (atoms) => parse(lex(atoms));

  test('parse 加法节点', () => {
    const a = ast(['2', '+', '3']);
    assertEqual(a.kind, 'binary'); assertEqual(a.op, '+');
    assertEqual(a.left.value, 2); assertEqual(a.right.value, 3);
  });
  test('parse 优先级 乘先于加', () => {
    const a = ast(['2', '+', '3', '*', '4']);
    assertEqual(a.op, '+'); assertEqual(a.right.op, '*');
  });
  test('parse ^ 右结合', () => {
    const a = ast(['2', '^', '3', '^', '2']); // 2^(3^2)
    assertEqual(a.op, '^'); assertEqual(a.right.op, '^');
  });
  test('parse 一元负号', () => {
    const a = ast(['-', '5']);
    assertEqual(a.kind, 'unary'); assertEqual(a.operand.value, 5);
  });
  test('parse 函数调用', () => {
    const a = ast(['sin(', '30', ')']);
    assertEqual(a.kind, 'call'); assertEqual(a.name, 'sin'); assertEqual(a.arg.value, 30);
  });
  test('parse 括号不匹配报错', () => assertThrows(() => ast(['(', '2']), 'Syntax Error'));
  test('parse 空输入报错', () => assertThrows(() => parse([]), 'Syntax Error'));
  test('parse nCr 二元节点', () => {
    const a = ast(['5', 'nCr', '2']);
    assertEqual(a.kind, 'binary'); assertEqual(a.op, 'nCr');
    assertEqual(a.left.value, 5); assertEqual(a.right.value, 2);
  });
  test('parse nCr 紧于乘法', () => {
    const a = ast(['5', 'nCr', '2', '*', '3']); // (5 nCr 2) * 3
    assertEqual(a.op, '*'); assertEqual(a.left.op, 'nCr');
  });

  const ev = (atoms, ctx = {}) =>
    evaluate(parse(lex(atoms)), { angleMode: 'DEG', ans: 0, vars: {}, ...ctx });

  test('eval 加乘优先级', () => assertEqual(ev(['2', '+', '3', '*', '4']), 14));
  test('eval 幂右结合', () => assertEqual(ev(['2', '^', '3', '^', '2']), 512));
  test('eval sin(30) DEG', () => assertClose(ev(['sin(', '30', ')']), 0.5));
  test('eval sin(pi/6) RAD', () => assertClose(ev(['sin(', 'pi', '/', '6', ')'], { angleMode: 'RAD' }), 0.5));
  test('eval sqrt', () => assertEqual(ev(['sqrt(', '9', ')']), 3));
  test('eval 百分比', () => assertEqual(ev(['50', '%']), 0.5));
  test('eval Ans', () => assertEqual(ev(['Ans', '+', '1'], { ans: 41 }), 42));
  test('eval 变量', () => assertEqual(ev(['A', '*', '2'], { vars: { A: 21 } }), 42));
  test('eval 除零 Math Error', () => assertThrows(() => ev(['1', '/', '0']), 'Math Error'));
  test('eval ln(0) Math Error', () => assertThrows(() => ev(['ln(', '0', ')']), 'Math Error'));
  test('eval sqrt(-1) Math Error', () => assertThrows(() => ev(['sqrt(', '-', '1', ')']), 'Math Error'));
  test('eval log(1000)=3', () => assertClose(ev(['log(', '1000', ')']), 3));
  test('eval log(0) Math Error', () => assertThrows(() => ev(['log(', '0', ')']), 'Math Error'));
  test('eval asin(0.5)=30 DEG', () => assertClose(ev(['asin(', '0.5', ')']), 30));
  test('eval asin(0.5)=pi/6 RAD', () => assertClose(ev(['asin(', '0.5', ')'], { angleMode: 'RAD' }), Math.PI / 6));
  test('eval acos(1)=0', () => assertClose(ev(['acos(', '1', ')']), 0));
  test('eval atan(1)=45 DEG', () => assertClose(ev(['atan(', '1', ')']), 45));
  test('eval asin(2) Math Error', () => assertThrows(() => ev(['asin(', '2', ')']), 'Math Error'));
  test('eval cbrt(-8)=-2', () => assertClose(ev(['cbrt(', '-', '8', ')']), -2));
  test('eval abs(-5)=5', () => assertEqual(ev(['abs(', '-', '5', ')']), 5));
  test('eval nCr(5,2)=10', () => assertEqual(ev(['5', 'nCr', '2']), 10));
  test('eval nPr(5,2)=20', () => assertEqual(ev(['5', 'nPr', '2']), 20));
  test('eval nCr 优先级 5C2*3=30', () => assertEqual(ev(['5', 'nCr', '2', '*', '3']), 30));
  test('eval nCr(2,5) Math Error', () => assertThrows(() => ev(['2', 'nCr', '5']), 'Math Error'));
  test('eval nCr(5,-1) Math Error', () => assertThrows(() => ev(['5', 'nCr', '-', '1']), 'Math Error'));
  test('eval nCr(5.5,2) Math Error', () => assertThrows(() => ev(['5.5', 'nCr', '2']), 'Math Error'));

  const engineCtx = { angleMode: 'DEG', ans: 0, vars: {} };
  test('engine 成功返回 display', () => {
    const r = engineEval(['0.1', '+', '0.2'], engineCtx);
    assertEqual(r.ok, true); assertEqual(r.display, '0.3');
  });
  test('engine 语法错误', () => {
    const r = engineEval(['(', '2'], engineCtx);
    assertEqual(r.ok, false); assertEqual(r.error, 'Syntax Error');
  });
  test('engine 数学错误', () => {
    const r = engineEval(['1', '/', '0'], engineCtx);
    assertEqual(r.ok, false); assertEqual(r.error, 'Math Error');
  });

  test('insertDigit 合并数字', () => {
    const e = new Editor();
    e.insertDigit('3'); e.insertDigit('1');
    assertEqual(e.atoms.join(','), '31');
  });
  test('insertAtom 与运算符分隔', () => {
    const e = new Editor();
    e.insertDigit('2'); e.insertAtom('+'); e.insertDigit('3');
    assertEqual(e.atoms.join(','), '2,+,3');
  });
  test('backspace 删数字字符', () => {
    const e = new Editor();
    e.insertDigit('3'); e.insertDigit('1'); e.backspace();
    assertEqual(e.atoms.join(','), '3');
  });
  test('backspace 删整个原子', () => {
    const e = new Editor();
    e.insertDigit('2'); e.insertAtom('+'); e.backspace();
    assertEqual(e.atoms.join(','), '2');
  });
  test('光标中间插入数字并入左侧数字', () => {
    const e = new Editor();
    e.insertDigit('2'); e.insertAtom('+'); e.insertDigit('3');
    e.moveLeft(); e.moveLeft(); // 光标在 + 之前
    e.insertDigit('9');
    assertEqual(e.atoms.join(','), '29,+,3');
  });
  test('前插数字并入右侧数字', () => {
    const e = new Editor();
    e.insertDigit('2'); e.moveLeft(); e.insertDigit('9');
    assertEqual(e.atoms.join(','), '92');
  });
  test('undo/redo', () => {
    const e = new Editor();
    e.insertDigit('2'); e.insertAtom('+');
    e.undo();
    assertEqual(e.atoms.join(','), '2');
    e.redo();
    assertEqual(e.atoms.join(','), '2,+');
  });
  test('clear 后可 undo', () => {
    const e = new Editor();
    e.insertDigit('5'); e.clear();
    assertEqual(e.atoms.length, 0);
    e.undo();
    assertEqual(e.atoms.join(','), '5');
  });
  test('setCursor 定位并钳制光标', () => {
    const e = new Editor();
    e.insertDigit('2'); e.insertAtom('+'); e.insertDigit('3');   // atoms: 2,+,3  cursor=3
    e.setCursor(1); assertEqual(e.cursor, 1);
    e.setCursor(99); assertEqual(e.cursor, 3);                   // 钳制到末尾
    e.setCursor(-5); assertEqual(e.cursor, 0);                    // 钳制到开头
  });
  test('setCursor 数字内偏移', () => {
    const e = new Editor();
    e.insertDigit('1'); e.insertDigit('2'); e.insertDigit('3'); e.insertDigit('4'); // ["1234"]
    e.setCursor(0, 2); assertEqual(e.cursor, 0); assertEqual(e.offset, 2);           // 2 与 3 之间
    e.setCursor(0, 99); assertEqual(e.cursor, 1); assertEqual(e.offset, 0);          // 右边界→(1,0)
    e.setCursor(0, -5); assertEqual(e.cursor, 0); assertEqual(e.offset, 0);          // 钳制到开头
  });
  test('setCursor 非数字原子 offset 强制 0', () => {
    const e = new Editor();
    e.insertDigit('2'); e.insertAtom('+'); e.insertDigit('3');                       // ["2","+","3"]
    e.setCursor(1, 5); assertEqual(e.cursor, 1); assertEqual(e.offset, 0);
  });
  test('insertDigit 数字内插入', () => {
    const e = new Editor();
    e.insertDigit('1'); e.insertDigit('2'); e.insertDigit('3'); e.insertDigit('4'); // ["1234"]
    e.setCursor(0, 2); e.insertDigit('5');                                            // 12|5|34 → 12534
    assertEqual(e.atoms.join(','), '12534');
    assertEqual(e.cursor, 0); assertEqual(e.offset, 3);
  });
  test('backspace 数字内删字符', () => {
    const e = new Editor();
    e.insertDigit('1'); e.insertDigit('2'); e.insertDigit('3'); e.insertDigit('4');
    e.setCursor(0, 2); e.backspace();                                                // 删 2 → 134
    assertEqual(e.atoms.join(','), '134');
    assertEqual(e.cursor, 0); assertEqual(e.offset, 1);
  });
  test('backspace 数字内删到空原子', () => {
    const e = new Editor();
    e.insertDigit('5'); e.insertDigit('6');                                          // ["56"]
    e.setCursor(0, 1); e.backspace();                                                // 删 5 → ["6"]
    assertEqual(e.atoms.join(','), '6');
    assertEqual(e.cursor, 0); assertEqual(e.offset, 0);
  });
  test('moveLeft/moveRight 逐字符跨原子', () => {
    const e = new Editor();
    e.insertDigit('1'); e.insertDigit('2'); e.insertDigit('3'); e.insertDigit('4'); // ["1234"] (1,0)
    e.moveLeft();  assertEqual(e.cursor, 0); assertEqual(e.offset, 3);                // 进 1234 右端
    e.moveLeft();  assertEqual(e.offset, 2);
    e.moveLeft();  assertEqual(e.offset, 1);
    e.moveLeft();  assertEqual(e.offset, 0);
    e.moveLeft();  assertEqual(e.cursor, 0); assertEqual(e.offset, 0);               // 已到头,no-op
    e.moveRight(); assertEqual(e.offset, 1);
    e.moveRight(); assertEqual(e.offset, 2);
    e.moveRight(); assertEqual(e.offset, 3);
    e.moveRight(); assertEqual(e.cursor, 1); assertEqual(e.offset, 0);              // 跨到末尾
  });
  test('1字符数字一步跨过', () => {
    const e = new Editor();
    e.insertDigit('5'); e.insertAtom('+'); e.insertDigit('3');                       // ["5","+","3"] (3,0)
    e.setCursor(1); e.moveLeft();                                                     // "5" 1 字符 → (0,0)
    assertEqual(e.cursor, 0); assertEqual(e.offset, 0);
    e.moveRight(); assertEqual(e.cursor, 1); assertEqual(e.offset, 0);              // 一步跨回
  });
  test('undo/redo 恢复 offset', () => {
    const e = new Editor();
    e.insertDigit('1'); e.insertDigit('2'); e.insertDigit('3'); e.insertDigit('4');
    e.setCursor(0, 2); e.insertDigit('5');                                            // 12534 (0,3)
    e.undo();                                                                        // → ["1234"] (0,2)
    assertEqual(e.atoms.join(','), '1234');
    assertEqual(e.cursor, 0); assertEqual(e.offset, 2);
    e.redo();
    assertEqual(e.atoms.join(','), '12534');
    assertEqual(e.cursor, 0); assertEqual(e.offset, 3);
  });
  test('insertAtom 数字内分裂', () => {
    const e = new Editor();
    e.insertDigit('1'); e.insertDigit('2'); e.insertDigit('3'); e.insertDigit('4');
    e.setCursor(0, 2); e.insertAtom('+');                                            // 12 + 34 → ["12","+","34"]
    assertEqual(e.atoms.join(','), '12,+,34');
    assertEqual(e.cursor, 2); assertEqual(e.offset, 0);
  });
  test('insertAtoms 批量插入到光标处', () => {
    const e = new Editor();
    e.insertDigit('3'); e.insertAtom('*');            // ["3","*"] 光标在末尾
    e.insertAtoms(['12', '+', '8']);
    assertEqual(e.atoms.join(','), '3,*,12,+,8');
  });
  test('insertAtoms 空数组 no-op', () => {
    const e = new Editor();
    e.insertDigit('5');
    e.insertAtoms([]);
    assertEqual(e.atoms.join(','), '5');
  });
  test('点号数字内不重复', () => {
    const e = new Editor();
    e.insertDigit('3'); e.insertDigit('.'); e.insertDigit('4');                     // ["3.4"]
    e.setCursor(0, 2); e.insertDigit('.');                                           // 拒绝,无变化
    assertEqual(e.atoms.join(','), '3.4');
    assertEqual(e.cursor, 0); assertEqual(e.offset, 2);
  });

  test('addHistory 最新在前', () => {
    const s = new Store(memStorage());
    s.addHistory(['1', '+', '1'], '2');
    s.addHistory(['2', '*', '2'], '4');
    assertEqual(s.history[0].display, '4');
    assertEqual(s.history[1].display, '2');
  });
  test('变量读写', () => {
    const s = new Store(memStorage());
    s.setVar('A', 42);
    assertEqual(s.getVar('A'), 42);
    assertEqual(s.vars.A, 42);
  });
  test('持久化跨实例', () => {
    const mem = memStorage();
    const s1 = new Store(mem);
    s1.setVar('B', 7); s1.addHistory(['B'], '7');
    const s2 = new Store(mem);
    assertEqual(s2.getVar('B'), 7);
    assertEqual(s2.history[0].display, '7');
  });
  test('历史上限 100', () => {
    const s = new Store(memStorage());
    for (let i = 0; i < 105; i++) s.addHistory([String(i)], String(i));
    assertEqual(s.history.length, 100);
    assertEqual(s.history[0].display, '104');
  });

  test('默认 DEG', () => assertEqual(new AppState().angleMode, 'DEG'));
  test('切换角度模式', () => {
    const s = new AppState(); s.toggleAngleMode();
    assertEqual(s.angleMode, 'RAD');
  });
  test('shift 切换与清除', () => {
    const s = new AppState();
    s.toggleShift(); assertEqual(s.shift, true);
    s.clearShift(); assertEqual(s.shift, false);
  });
  test('ans 读写', () => {
    const s = new AppState(); s.ans = 42;
    assertEqual(s.ans, 42);
  });
  test('recall 默认 null', () => assertEqual(new AppState().recall, null));
  test('recall 读写与重置', () => {
    const s = new AppState();
    s.recall = 2; assertEqual(s.recall, 2);
    s.resetRecall(); assertEqual(s.recall, null);
  });

  test('数字键动作', () => {
    assertEqual(ACTIONS['7'].kind, 'digit');
    assertEqual(ACTIONS['7'].payload, '7');
  });
  test('运算符动作', () => {
    assertEqual(ACTIONS.mul.kind, 'atom');
    assertEqual(ACTIONS.mul.payload, '*');
  });
  test('函数作为原子', () => {
    assertEqual(ACTIONS.sin.payload, 'sin(');
  });
  test('占位键', () => {
    assertEqual(ACTIONS.fxs.kind, 'placeholder');
  });
  test('mathUp/mathDown 非占位', () => {
    assertEqual(ACTIONS.mathUp.kind, 'historyUp');
    assertEqual(ACTIONS.mathDown.kind, 'historyDown');
  });
  test('物理键映射', () => {
    assertEqual(KEYBOARD['Enter'], 'equals');
    assertEqual(KEYBOARD['Backspace'], 'back');
    assertEqual(KEYBOARD['*'], 'mul');
    assertEqual(KEYBOARD['ArrowUp'], 'mathUp');
    assertEqual(KEYBOARD['ArrowDown'], 'mathDown');
  });
  test('Shift 第二功能 0→%', () => {
    assertEqual(SHIFT_ACTIONS['0'].kind, 'atom');
    assertEqual(SHIFT_ACTIONS['0'].payload, '%');
  });
  test('Shift 第二功能 EE→e^x', () => {
    assertEqual(SHIFT_ACTIONS.eex.kind, 'func');
    assertEqual(SHIFT_ACTIONS.eex.payload, 'epow');
  });
  test('SHIFT ln→log 带 label', () => {
    assertEqual(SHIFT_ACTIONS.ln.kind, 'atom');
    assertEqual(SHIFT_ACTIONS.ln.payload, 'log(');
    assertEqual(SHIFT_ACTIONS.ln.label, 'log');
  });
  test('SHIFT sin→asin 带 label', () => {
    assertEqual(SHIFT_ACTIONS.sin.payload, 'asin(');
    assertEqual(SHIFT_ACTIONS.sin.label, 'sin⁻¹');
  });
  test('SHIFT add→nCr', () => {
    assertEqual(SHIFT_ACTIONS.add.payload, 'nCr');
    assertEqual(SHIFT_ACTIONS.add.label, 'nCr');
  });
  test('SHIFT square→cube func', () => {
    assertEqual(SHIFT_ACTIONS.square.kind, 'func');
    assertEqual(SHIFT_ACTIONS.square.payload, 'cube');
  });
  test('math 动作非 placeholder', () => {
    assertEqual(ACTIONS.math.kind, 'math');
  });

  test('MATH_CATALOG 分类齐全', () => {
    const titles = MATH_CATALOG.map(g => g.title);
    assertEqual(titles.join(','), 'math.trig,math.logexp,math.powroot,math.comb,math.const');
  });
  test('MATH_CATALOG 每条目有 label 与 action', () => {
    for (const g of MATH_CATALOG) for (const it of g.items) {
      if (!it.label || !it.action || !it.action.kind)
        throw new Error('bad item ' + JSON.stringify(it));
    }
  });
  test('MATH_CATALOG 原子能被 lexer 识别', () => {
    // 仅校验 kind:'atom' 且 payload 为完整原子（func 展开由 app 负责，跳过）
    for (const g of MATH_CATALOG) for (const it of g.items) {
      if (it.action.kind === 'atom') {
        lex([it.action.payload]); // 不抛异常即通过
      }
    }
  });

  // ---- i18n ----
  test('i18n 含 6 种联合国官方语言', () => {
    const codes = LOCALES.map(l => l.code).join(',');
    assertEqual(codes, 'en,zh,fr,es,ru,ar');
  });
  test('i18n 每种语言有 dir 与 label', () => {
    for (const l of LOCALES) {
      if (!l.dir || !l.label) throw new Error('bad locale ' + JSON.stringify(l));
    }
  });
  test('i18n ar 为 RTL，其余 LTR', () => {
    assertEqual(LOCALES.find(l => l.code === 'ar').dir, 'rtl');
    for (const l of LOCALES) if (l.code !== 'ar') assertEqual(l.dir, 'ltr');
  });
  test('i18n setLocale 拒绝未知 code', () => {
    setLocale('en');
    const before = getLocale();
    assertEqual(setLocale('bogus'), false);
    assertEqual(getLocale(), before);
  });
  test('i18n cycleLocale 遍历全部并回到起点', () => {
    setLocale('en');
    const seen = [];
    for (let i = 0; i < 6; i++) seen.push(cycleLocale().code);
    assertEqual(seen.join(','), 'zh,fr,es,ru,ar,en');
    assertEqual(getLocale(), 'en');
  });
  test('i18n t() 按当前语言取值', () => {
    setLocale('en'); assertEqual(t('historyTitle'), 'History');
    setLocale('zh'); assertEqual(t('historyTitle'), '历史记录');
    setLocale('fr'); assertEqual(t('historyTitle'), 'Historique');
    setLocale('ar'); assertEqual(t('historyTitle'), 'السجل');
    setLocale('en');
  });
  test('i18n t() 占位符替换', () => {
    setLocale('zh'); assertEqual(t('storedIn', { name: 'A' }), '已存入 A');
    setLocale('en'); assertEqual(t('storedIn', { name: 'Q' }), 'Stored to Q');
  });
  test('i18n t() 未知 key 回退到 key 本身', () => {
    assertEqual(t('no.such.key'), 'no.such.key');
  });
  test('i18n copied / pasteFail / noAns 六语言齐全', () => {
    for (const key of ['copied', 'pasteFail', 'noAns']) {
      for (const code of ['en','zh','fr','es','ru','ar']) {
        setLocale(code);
        const s = t(key);
        if (!s || s === key) throw new Error('missing ' + key + ' for ' + code);
      }
    }
    setLocale('en');
  });
  test('i18n getLocaleMeta 返回当前语言元信息', () => {
    setLocale('ar');
    assertEqual(getLocaleMeta().code, 'ar');
    assertEqual(getLocaleMeta().dir, 'rtl');
    setLocale('en');
  });
  test('i18n MATH 分组 title 可被 t() 解析', () => {
    for (const g of MATH_CATALOG) {
      const s = t(g.title);
      if (!s || s === g.title) throw new Error('unresolved title key ' + g.title);
    }
  });

  // ---- tape.buildTape ----
  const mkHist = (...items) => items.map(([display, ts]) => ({ atoms: [display], display, ts }));
  // history 为 newest-first（ts 大在前），模拟 store.history
  const H = mkHist(['d4', 4], ['d3', 3], ['d2', 2], ['d1', 1]);

  test('buildTape 默认只含会话(ts>baseline)、oldest-first', () => {
    // baseline=2 ⇒ session = d3,d4 ；showOlder=false
    const r = buildTape(H, 2, false).map(e => e.display).join(',');
    assertEqual(r, 'd3,d4');
  });
  test('buildTape showOlder 拼接 older 在前，均 oldest-first', () => {
    // baseline=2 ⇒ older = d1,d2 ; session = d3,d4
    const r = buildTape(H, 2, true).map(e => e.display).join(',');
    assertEqual(r, 'd1,d2,d3,d4');
  });
  test('buildTape baseline=0 全为会话', () => {
    assertEqual(buildTape(H, 0, false).map(e => e.display).join(','), 'd1,d2,d3,d4');
  });
  test('buildTape 全为 older 时 showOlder=false 返回空', () => {
    // baseline=4（≥ 所有 ts）⇒ session 为空
    assertEqual(buildTape(H, 4, false).length, 0);
  });
  test('buildTape 空 history 返回空', () => {
    assertEqual(buildTape([], 0, true).length, 0);
  });

  // ---- AC 两段式判据(输入是否为空)----
  // 不测 app.js 的 dispatch(依赖 DOM),只测判据语义:editor.atoms.length>0 → 非空。
  // 注:以下 3 例为 editor.atoms.length 语义守护,不覆盖本次重构的 DOM 行为
  //    (renderCurrentInput / setResultLine / pointer 委托);那部分需在浏览器跑
  //    runAll(120 例)做回归 —— 本文件无法运行浏览器套件,故留作人工验证项。
  test('AC 判据:空 editor 视为输入已空', () => {
    const e = new Editor();
    assertEqual(e.atoms.length, 0);   // 即 AC 第二段(resetToNormal)的触发条件
  });
  test('AC 判据:有原子视为输入非空', () => {
    const e = new Editor();
    e.insertDigit('5'); e.insertAtom('+'); e.insertDigit('3');
    assertEqual(e.atoms.length, 3);   // 即 AC 第一段(清空)的触发条件
  });
  test('AC 清空后回到空(editor.clear 语义)', () => {
    const e = new Editor();
    e.insertDigit('5'); e.insertAtom('+'); e.insertDigit('3');
    e.clear();
    assertEqual(e.atoms.length, 0);   // 清空后第二段触发条件成立
  });

  // ---- 运算符前置 Ans（空输入按二元运算符）判据 ----
  // 不测 app.js 的 execAction（依赖 DOM/全局），只测判据语义：
  // 空 editor 按二元运算符(+ − × ÷ ^ nCr nPr) 时需要左操作数。
  test('空输入按运算符:需左操作数 (空 editor 判据)', () => {
    const e = new Editor();
    assertEqual(e.atoms.length, 0);   // 空输入：触发"前置 Ans"判据
    e.insertAtom('+');                // 没有 Ans 补位时直接插入 → 形成孤立 +
    assertEqual(e.atoms.join(','), '+'); // 后续 lex/parse 会报 Syntax Error(由引擎把关)
  });
  test('有内容时按运算符:正常插入(无需补 Ans)', () => {
    const e = new Editor();
    e.insertDigit('2');               // 非空 → 不触发前置判据
    e.insertAtom('+'); e.insertDigit('3');
    assertEqual(e.atoms.join(','), '2,+,3');
  });

  // ---- Update banner i18n keys ----
  test('i18n: update.available / update.reload 存在且 en 兜底', () => {
    setLocale('en');
    assertEqual(t('update.available'), 'New version available');
    assertEqual(t('update.reload'), 'Update');
  });
  test('i18n: update.* 至少 6 语言齐全', () => {
    for (const loc of LOCALES) {
      setLocale(loc.code);
      assertEqual(typeof t('update.available'), 'string');
      assertEqual(t('update.available').length > 0, true);
      assertEqual(t('update.reload').length > 0, true);
    }
    setLocale('en');
  });

  // ---- update.js banner state machine (pure decision, no real SW) ----
  test('shouldShowBanner: installed + has controller → true', () => {
    assertEqual(shouldShowBanner('installed', true), true);
  });
  test('shouldShowBanner: installed 但无 controller(首次安装) → false', () => {
    assertEqual(shouldShowBanner('installed', false), false);
  });
  test('shouldShowBanner: installing 态不提示', () => {
    assertEqual(shouldShowBanner('installing', true), false);
  });
  test('shouldShowBanner: activating/activated 不提示(此时已无 waiting)', () => {
    assertEqual(shouldShowBanner('activating', true), false);
    assertEqual(shouldShowBanner('activated', true), false);
  });

  // ---- update.js controllerchange reload guard (pure decision) ----
  // sw.js activate → self.clients.claim() → controller transitions null→new SW,
  // which fires controllerchange on EVERY install including the first. The reload
  // must be guarded to fire only on a genuine update (a controller existed before).
  test('shouldReloadOnControllerChange: 首次安装(无前置 controller) → 不刷新', () => {
    assertEqual(shouldReloadOnControllerChange(false), false);
  });
  test('shouldReloadOnControllerChange: 更新(有前置 controller) → 刷新', () => {
    assertEqual(shouldReloadOnControllerChange(true), true);
  });

  runAll();
</script>
