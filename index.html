<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scientific Calculator</title>
  <!--
    版本入口页：访问根路径会自动跳转到「当前版本」的快照目录。
    发新版本时只需改下面两处 v5 为新版本号（如 v6），并新建对应的 v6/ 快照。
    旧版本目录保留，仍可通过 /v5/ 等地址访问、回滚。

    ====== 当前版本：v5 ======
  -->
  <meta http-equiv="refresh" content="0; url=v5/">
  <!-- ====== 当前版本：v5 ====== -->
  <style>
    html, body { height: 100%; margin: 0; background: #000; color: #fff;
      font-family: -apple-system, system-ui, sans-serif; }
    #gate { min-height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; }
    .name { font-size: 20px; letter-spacing: 1px; opacity: .9; }
    .ver  { font-size: 13px; color: #8a8a8e; letter-spacing: 2px; }
    .ver b { color: #f5c518; }
    .hint { font-size: 12px; color: #5a5a5e; margin-top: 8px; }
    .hint a { color: #0a84ff; text-decoration: none; }
  </style>
</head>
<body>
  <div id="gate">
    <div class="name">Scientific Calculator</div>
    <div class="ver">版本 <b>v5</b> · 跳转中…</div>
    <div class="hint">未自动跳转可 <a href="v5/">点此进入</a></div>
  </div>
  <!-- 用 replace 跳转：回退键不会被卡在本入口页 -->
  <script>location.replace('v5/');</script>
</body>
</html>
