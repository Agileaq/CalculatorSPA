<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scientific Calculator</title>
  <!--
    Version gate page: visiting the root path redirects to the current
    version snapshot directory. To release a new version, change the two
    v6 markers below to the new number (e.g. v7) and create the matching
    v7/ snapshot. Old snapshot dirs are preserved for rollback.

    ====== Current version: v6 ======
  -->
  <meta http-equiv="refresh" content="0; url=v6/">
  <!-- ====== Current version: v6 ====== -->
  <style>
    html, body { height: 100%; margin: 0; background: #000; color: #fff;
      font-family: -apple-system, system-ui, sans-serif; }
    #gate { min-height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; }
    .name { font-size: 20px; letter-spacing: 1px; opacity: .9; }
    .ver  { font-size: 13px; color: #8a8a8e; letter-spacing: 2px; }
    .ver b { color: #f5c518; }
    .hint { font-size: 12px; color: #5a5a5e; margin-top: 8px; }
    .hint a { color: #0a84ff; text-decoration: none; }
  </style>
</head>
<body>
  <div id="gate">
    <div class="name">Scientific Calculator</div>
    <div class="ver">version <b>v6</b> · redirecting…</div>
    <div class="hint">Not redirected? <a href="v6/">Enter here</a></div>
  </div>
  <!-- replace-redirect: back button not trapped on the gate page -->
  <script>location.replace('v6/');</script>
</body>
</html>
